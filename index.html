<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Chinchón – Marcador</title>
  <meta name="description" content="Marcador de Chinchón: grupos, partidas, reenganches, historial y normas.">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chinchón">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,500..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.14.0">
</head>
<body>
  <header class="topbar">
    <div class="row" style="gap:8px;align-items:baseline">
      <h1 id="title">Chinchón</h1>
      <span id="role-pill" class="role-pill" onclick="handleRolePillClick()"></span>
    </div>
    <div class="row" style="gap:4px;align-items:center">
      <button id="btn-admin-wheel" class="btn-icon" title="Ajustes" onclick="openAdminSettings()">⚙️</button>
      <span id="version" class="version"></span>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <button id="tab-play" data-tab="play"><span>Jugar</span></button>
    <button id="tab-groups" data-tab="groups"><span>Amigos</span></button>
    <button id="tab-history" data-tab="history"><span>Historial</span></button>
    <button id="tab-rules" data-tab="rules"><span>Normas</span></button>
  </nav>
  <div id="toast"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="lockscreen" class="lockscreen hidden"></div>
  <script src="mqttws31.min.js"></script>
  <script src="app.js?v=1.14.0"></script>

</html>
